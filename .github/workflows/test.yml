name: PMRS test suite

on:
  pull_request:
  push:
    branches:
      - main
      - fix/admin-cms-branding-field-media

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API, UI, contrast and hero tests
        run: npm run test:all
