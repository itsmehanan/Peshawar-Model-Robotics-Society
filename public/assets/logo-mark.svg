<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-label="Peshawar Model Robotics Society">
  <title>PMRS</title>
  <defs>
  <linearGradient id="gMetal" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.18" stop-color="#d3ddea"/><stop offset="0.46" stop-color="#8f9cad"/><stop offset="0.6" stop-color="#e6edf7"/><stop offset="0.8" stop-color="#7d8a9c"/><stop offset="1" stop-color="#c2cedd"/></linearGradient>
  <linearGradient id="gMetalLight" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#e2eaf5"/><stop offset="0.56" stop-color="#a7b4c6"/><stop offset="0.76" stop-color="#edf3fb"/><stop offset="1" stop-color="#96a4b7"/></linearGradient>
  <linearGradient id="gMetalDeep" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#5d6877"/><stop offset="0.5" stop-color="#39424f"/><stop offset="1" stop-color="#6f7c8d"/></linearGradient>
  <linearGradient id="gMetalDark" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.2" stop-color="#cfd9e6"/><stop offset="0.5" stop-color="#7b889a"/><stop offset="0.65" stop-color="#dee7f2"/><stop offset="1" stop-color="#8d9aac"/></linearGradient>
  <linearGradient id="gMetalLightDark" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#e9eff7"/><stop offset="0.35" stop-color="#b6c2d2"/><stop offset="0.6" stop-color="#8593a6"/><stop offset="0.85" stop-color="#cfd9e6"/><stop offset="1" stop-color="#9aa8bb"/></linearGradient>
  <linearGradient id="gMetalDeepDark" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#6b7888"/><stop offset="0.5" stop-color="#4a5563"/><stop offset="1" stop-color="#7d8a9a"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0.7">
    <stop offset="0" stop-color="#f9e3ae"/><stop offset="0.35" stop-color="#e8b866"/>
    <stop offset="0.72" stop-color="#c89342"/><stop offset="1" stop-color="#f6d88f"/>
  </linearGradient>
  <linearGradient id="gSparks" x1="0" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#cdf3ff"/><stop offset="0.45" stop-color="#3ab8f3"/>
    <stop offset="1" stop-color="#1d8ecd"/>
  </linearGradient>
  <linearGradient id="gCube" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#6fd6ff" stop-opacity="0.34"/>
    <stop offset="0.55" stop-color="#1d9fe0" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#0f6ea6" stop-opacity="0.28"/>
  </linearGradient>
    <radialGradient id="gHalo" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#1f8fd4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1f8fd4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="99" fill="url(#gHalo)"/>
  
  <!-- spokes: four machined ribs so the ring reads as a structure, not a hoop -->
  <g fill="url(#gMetalLight)" opacity="0.75">
    <path d="M97 34 L103 34 L103 66 L97 66 Z"/>
    <path d="M97 134 L103 134 L103 166 L97 166 Z"/>
    <path d="M34 97 L34 103 L66 103 L66 97 Z"/>
    <path d="M134 97 L134 103 L166 103 L166 97 Z"/>
  </g>

  <!-- gear ring: engineering, the discipline underneath the ambition -->
  <g fill="url(#gMetal)" fill-rule="evenodd">
    <path d="M23 100A77 77 0 1 0 177 100A77 77 0 1 0 23 100ZM42 100A58 58 0 1 1 158 100A58 58 0 1 1 42 100Z"/>
    <path d="M94.07 26.24L95.95 13.09L104.05 13.09L105.93 26.24ZM131.74 33.15L139.95 22.71L146.96 26.76L142.02 39.09ZM160.91 57.98L173.24 53.04L177.29 60.05L166.85 68.26ZM173.76 94.07L186.91 95.95L186.91 104.05L173.76 105.93ZM166.85 131.74L177.29 139.95L173.24 146.96L160.91 142.02ZM142.02 160.91L146.96 173.24L139.95 177.29L131.74 166.85ZM105.93 173.76L104.05 186.91L95.95 186.91L94.07 173.76ZM68.26 166.85L60.05 177.29L53.04 173.24L57.98 160.91ZM39.09 142.02L26.76 146.96L22.71 139.95L33.15 131.74ZM26.24 105.93L13.09 104.05L13.09 95.95L26.24 94.07ZM33.15 68.26L22.71 60.05L26.76 53.04L39.09 57.98ZM57.98 39.09L53.04 26.76L60.05 22.71L68.26 33.15Z"/>
  </g>
  <path d="M23 100A77 77 0 1 0 177 100A77 77 0 1 0 23 100ZM42 100A58 58 0 1 1 158 100A58 58 0 1 1 42 100Z" fill="none" stroke="#f9fcff" stroke-opacity="0.16" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="67" fill="none" stroke="url(#gMetalDeep)" stroke-width="4" opacity="0.9"/>
  <circle cx="100" cy="100" r="67" fill="none" stroke="#f9fcff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- gold orbit: progress sweeping under the work, proud of the ring so it reads
       as a foreground element instead of tangling with the teeth -->
  <path d="M123.62 21.62A85.7 85.7 0 1 1 52.08 175.05L55.1 170.57A80.3 80.3 0 1 0 122.13 26.81Z" fill="url(#gGold)"/>
  <path d="M123.08 23.49A83.75 83.75 0 1 1 53.17 173.43L54.01 172.19A82.25 82.25 0 1 0 122.67 24.94Z" fill="#fff8e6" opacity="0.45"/>

  <!-- articulated arm: segments taper, every joint is cased. A bare line reads as
       a stick rather than as a machine. -->
  <g stroke-linecap="round">
    <path d="M60 146 L88 110" stroke="url(#gMetalDeep)" stroke-width="20"/>
    <path d="M60 146 L88 110" stroke="url(#gMetal)" stroke-width="14.5"/>
    <path d="M65 140 L86 113" stroke="#f9fcff" stroke-opacity="0.55" stroke-width="3.2"/>
    <path d="M88 110 L116 76" stroke="url(#gMetalDeep)" stroke-width="17"/>
    <path d="M88 110 L116 76" stroke="url(#gMetalLight)" stroke-width="12"/>
    <path d="M92 105 L113 79" stroke="#f9fcff" stroke-opacity="0.5" stroke-width="2.8"/>
    <path d="M116 76 L129 66" stroke="url(#gMetal)" stroke-width="10"/>
  </g>

  <g>
    <circle cx="60" cy="146" r="12" fill="url(#gMetalDeep)"/>
    <circle cx="60" cy="146" r="8.4" fill="url(#gMetal)"/>
    <circle cx="60" cy="146" r="3.4" fill="#0b1118"/>
    <circle cx="60" cy="146" r="3.4" fill="url(#gSparks)" opacity="0.6"/>
    <circle cx="88" cy="110" r="9.4" fill="url(#gMetalDeep)"/>
    <circle cx="88" cy="110" r="6.4" fill="url(#gMetalLight)"/>
    <circle cx="88" cy="110" r="2.5" fill="#0b1118"/>
  </g>

  <!-- faceplate the arm presents: a ring, so the cube sits ON it -->
  <circle cx="135" cy="61" r="15" fill="url(#gMetalDeep)"/>
  <circle cx="135" cy="61" r="11" fill="url(#gMetal)"/>
  <circle cx="135" cy="61" r="6" fill="#0b1118"/>
  <circle cx="135" cy="61" r="6" fill="url(#gSparks)" opacity="0.35"/>

  <!-- the cube: a wireframe idea held at the fingertips -->
  <g>
    <path d="M136 20 L166 37 L166 71 L136 88 L106 71 L106 37 Z"
          fill="url(#gCube)" stroke="url(#gSparks)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M106 37 L136 54 L166 37 M136 54 L136 88" stroke="url(#gSparks)"
          stroke-width="1.6" fill="none" opacity="0.85" stroke-linejoin="round"/>
    <path d="M136 20 L166 37 L166 71 L136 88 L106 71 L106 37 Z" fill="none"
          stroke="#d4f5ff" stroke-width="0.9" opacity="0.6"/>
  </g>
</svg>
